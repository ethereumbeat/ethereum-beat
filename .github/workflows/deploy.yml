name: Deploy

# The ONLY workflow that ships. Runs after a merge to main (and on demand),
# re-runs both audit gates as a hard pre-deploy check, injects the real D1/KV
# ids from secrets into a throwaway config (the tracked wrangler.toml keeps its
# REPLACE_WITH_YOUR_* placeholders — this repo is public), deploys the Worker,
# then smoke-tests production.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# never let two production deploys overlap; don't cancel one mid-flight
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # a GitHub Environment so approval can be required later via a repo setting
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── belt & braces: production never ships if either audit regressed.
      #    Same composite ci.yml uses, so audits can't drift. ────────────
      - uses: ./.github/actions/build-and-audit

      # ── inject real ids into a throwaway, git-ignored config. The tracked
      #    wrangler.toml is read-only here and must stay on its placeholders;
      #    the cron trigger ([triggers] crons) is copied verbatim, so the
      #    daily collector ships with the Worker — no separate scheduler. ──
      - name: Generate deploy config from secrets (never committed)
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          # Verified Email Routing destination for collector failure alerts.
          # Optional: unset → defaults to beat@ethereumbeat.org.
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          # ── daily broadcast (worker/broadcast). All optional: an unset secret
          #    is simply not injected → env.<VAR> undefined → that channel skips,
          #    never throws (same discipline as send_email). Same as the ids,
          #    these live ONLY in the throwaway ci.toml, never the public config. ──
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          NOSTR_RELAYS: ${{ secrets.NOSTR_RELAYS }}
          FARCASTER_FID: ${{ secrets.FARCASTER_FID }}
          FARCASTER_SIGNER: ${{ secrets.FARCASTER_SIGNER }}
          FARCASTER_HUB: ${{ secrets.FARCASTER_HUB }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PDS: ${{ secrets.BLUESKY_PDS }}
        run: |
          set -euo pipefail
          sed -e "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${CF_D1_DATABASE_ID}|" \
              -e "s|REPLACE_WITH_YOUR_KV_NAMESPACE_ID|${CF_KV_NAMESPACE_ID}|" \
              wrangler.toml > wrangler.ci.toml

          # ── Email Routing send_email binding: injected ONLY here, never in the
          #    committed public wrangler.toml. Forks therefore deploy without it
          #    (env.SEND_EMAIL undefined → the collector logs + skips the alert,
          #    never throws), and no fork's deploy fails Cloudflare's
          #    destination_address verification for an address they don't own.
          #    destination_address restricts sends to the maintainer's inbox. ──
          alert_to="${ALERT_EMAIL_TO:-beat@ethereumbeat.org}"
          cat >> wrangler.ci.toml <<EOF

          [[send_email]]
          name = "SEND_EMAIL"
          destination_address = "${alert_to}"
          EOF
          # constraint check: send_email must actually be present in the deploy config
          if ! grep -q 'name = "SEND_EMAIL"' wrangler.ci.toml; then
            echo "::error::send_email binding missing from generated deploy config"
            exit 1
          fi
          echo "send_email binding injected into wrangler.ci.toml (destination: ${alert_to})"

          # ── broadcast secrets → [vars]. TOML forbids a second [vars] table, so
          #    the set ones are inserted UNDER the existing [vars] header. Only
          #    non-empty secrets are written, so forks with none deploy a config
          #    identical to before. Values are TOML basic strings (nsec base32,
          #    fid digits, signer hex, relay/hub/PDS URLs, a bsky handle and an
          #    app password of lowercase-and-hyphens — no quotes/backslashes). ──
          broadcast_vars() {
            [ -n "${NOSTR_NSEC:-}" ]           && printf 'NOSTR_NSEC = "%s"\n' "$NOSTR_NSEC"
            [ -n "${NOSTR_RELAYS:-}" ]         && printf 'NOSTR_RELAYS = "%s"\n' "$NOSTR_RELAYS"
            [ -n "${FARCASTER_FID:-}" ]        && printf 'FARCASTER_FID = "%s"\n' "$FARCASTER_FID"
            [ -n "${FARCASTER_SIGNER:-}" ]     && printf 'FARCASTER_SIGNER = "%s"\n' "$FARCASTER_SIGNER"
            [ -n "${FARCASTER_HUB:-}" ]        && printf 'FARCASTER_HUB = "%s"\n' "$FARCASTER_HUB"
            [ -n "${BLUESKY_IDENTIFIER:-}" ]   && printf 'BLUESKY_IDENTIFIER = "%s"\n' "$BLUESKY_IDENTIFIER"
            [ -n "${BLUESKY_APP_PASSWORD:-}" ] && printf 'BLUESKY_APP_PASSWORD = "%s"\n' "$BLUESKY_APP_PASSWORD"
            [ -n "${BLUESKY_PDS:-}" ]          && printf 'BLUESKY_PDS = "%s"\n' "$BLUESKY_PDS"
            true
          }
          broadcast_vars > /tmp/broadcast-vars.txt
          awk 'BEGIN{f="/tmp/broadcast-vars.txt"} {print} /^\[vars\]$/{while((getline l<f)>0)print l; close(f)}' \
              wrangler.ci.toml > wrangler.ci.toml.tmp && mv wrangler.ci.toml.tmp wrangler.ci.toml
          rm -f /tmp/broadcast-vars.txt

          # verify each SET broadcast secret survived generation (key name only,
          # never the value, so nothing secret lands in the run log)
          for v in NOSTR_NSEC NOSTR_RELAYS FARCASTER_FID FARCASTER_SIGNER FARCASTER_HUB \
                   BLUESKY_IDENTIFIER BLUESKY_APP_PASSWORD BLUESKY_PDS; do
            eval "val=\${$v:-}"
            if [ -n "$val" ] && ! grep -q "^$v = " wrangler.ci.toml; then
              echo "::error::$v was set but did not survive into wrangler.ci.toml"
              exit 1
            fi
            [ -n "$val" ] && echo "broadcast var $v injected into wrangler.ci.toml"
          done

          # constraint check: the tracked file must NOT have been mutated
          if ! git diff --quiet -- wrangler.toml; then
            echo "::error::tracked wrangler.toml was modified — aborting"
            git --no-pager diff -- wrangler.toml
            exit 1
          fi
          # constraint check: the generated config must be untracked (gitignored)
          if git ls-files --error-unmatch wrangler.ci.toml >/dev/null 2>&1; then
            echo "::error::wrangler.ci.toml is tracked — it must stay gitignored"
            exit 1
          fi
          # constraint check: placeholders must actually be gone from the deploy
          # config (guards against an empty/missing secret shipping a bad id)
          if grep -q 'REPLACE_WITH_YOUR_' wrangler.ci.toml; then
            echo "::error::a secret was empty — placeholder still present in deploy config"
            exit 1
          fi
          echo "tracked wrangler.toml unchanged; wrangler.ci.toml generated (untracked)"

      - name: Deploy to Cloudflare (production)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.ci.toml

      # ── bust the ROADMAP KV snapshot so SSR rebuilds from D1 immediately ──
      #    Without this, a D1 reseed stays invisible in server HTML until the
      #    daily cron rewrites roadmap:latest (up to 24h of stale panels/meta).
      #    Scope: the roadmap snapshot ONLY — metric_meta / metric KV are never
      #    touched here. The page self-heals from D1 on a miss; the cron then
      #    repopulates the snapshot on its normal cadence.
      - name: Bust roadmap KV snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler.ci.toml (generated above, gitignored) carries the real SNAP
          # namespace id; --remote targets production KV.
          if npx wrangler kv key delete roadmap:latest --binding SNAP --remote -c wrangler.ci.toml; then
            echo "busted roadmap:latest (roadmap snapshot only)"
          else
            echo "::warning::roadmap:latest KV bust did not succeed — SSR will refresh on the next cron"
          fi

      # ── post-deploy smoke test: fail the run if production is wrong ─────
      - name: Smoke test production
        run: |
          set -uo pipefail
          base="https://ethereumbeat.org"
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          # a new version can take a few seconds to roll out — retry each check
          check() {
            local url="$1" want="$2" got=""
            for i in $(seq 1 10); do
              got="$(code "$url")"
              if [ "$got" = "$want" ]; then echo "ok   $url -> $got"; return 0; fi
              sleep 3
            done
            echo "::error::$url returned $got, expected $want"
            return 1
          }
          check "$base/"                      200 || exit 1
          check "$base/pulse/txcount_combined" 200 || exit 1
          # guards the unknown-metric 404 fix from regressing
          check "$base/pulse/txcount"          404 || exit 1
          check "$base/api/snapshot"           200 || exit 1
          if curl -s "$base/api/snapshot" | python3 -c "import sys,json; json.load(sys.stdin)"; then
            echo "ok   /api/snapshot is valid JSON"
          else
            echo "::error::/api/snapshot did not return valid JSON"
            exit 1
          fi

          # ── /roadmap: server HTML must carry the CURRENT panels (not a stale
          #    snapshot) and a data-derived meta description (not a fixed fork
          #    list). Both guard the KV-bust + derived-meta fix from regressing. ──
          rm_html=""
          for i in $(seq 1 10); do
            rm_html="$(curl -s "$base/roadmap")"
            printf '%s' "$rm_html" | grep -q 'data-rm-track' && break
            sleep 3
          done
          rm_forks="$(printf '%s' "$rm_html" | grep -o 'data-idx="[0-9]"' | sort -u | wc -l | tr -d ' ')"
          if [ "${rm_forks:-0}" -ge 4 ]; then
            echo "ok   /roadmap SSR has $rm_forks panels (current snapshot)"
          else
            echo "::error::/roadmap SSR shows only ${rm_forks:-0} panels — stale KV snapshot?"
            exit 1
          fi
          rm_desc="$(printf '%s' "$rm_html" | grep -o '<meta name="description" content="[^"]*"' | head -1)"
          # names present in the live data but absent from the old hardcoded string
          # → their presence proves the description is data-derived, not the literal.
          if printf '%s' "$rm_desc" | grep -qE 'Pectra|Verge'; then
            echo "ok   /roadmap meta description is data-derived"
          else
            echo "::error::/roadmap meta description not data-derived (got: $rm_desc)"
            exit 1
          fi

          # ── RFC 9116 security.txt: 200, text/plain, a Contact: line pointing
          #    at the live beat+security@ subaddress (guards a future edit from
          #    reintroducing a bouncing address), and a non-stale Expires ──────
          sec_url="$base/.well-known/security.txt"
          scode=""
          for i in $(seq 1 10); do
            scode="$(curl -s -D /tmp/sec.hdr -o /tmp/sec.txt -w '%{http_code}' "$sec_url")"
            [ "$scode" = "200" ] && break
            sleep 3
          done
          [ "$scode" = "200" ] && echo "ok   $sec_url -> 200" \
            || { echo "::error::$sec_url returned $scode, expected 200"; exit 1; }
          if grep -iq '^content-type:[[:space:]]*text/plain' /tmp/sec.hdr; then
            echo "ok   security.txt content-type is text/plain"
          else
            echo "::error::security.txt content-type is not text/plain"
            grep -i '^content-type:' /tmp/sec.hdr || true
            exit 1
          fi
          grep -q '^Contact:' /tmp/sec.txt && echo "ok   security.txt has a Contact: line" \
            || { echo "::error::security.txt is missing a Contact: line"; exit 1; }
          if grep '^Contact:' /tmp/sec.txt | grep -qF 'beat+security@ethereumbeat.org'; then
            echo "ok   security.txt Contact is beat+security@ethereumbeat.org"
          else
            echo "::error::security.txt Contact is not beat+security@ethereumbeat.org (a bouncing address may have crept in)"
            exit 1
          fi
          expires="$(grep -i '^Expires:' /tmp/sec.txt | head -1 | sed 's/^[Ee]xpires:[[:space:]]*//' | tr -d '\r')"
          exp_s="$(date -d "$expires" +%s 2>/dev/null)" \
            || { echo "::error::security.txt Expires '$expires' is not a parseable date"; exit 1; }
          if [ "$exp_s" -gt "$(date -d '+30 days' +%s)" ]; then
            echo "ok   security.txt Expires ($expires) is more than 30 days out"
          else
            echo "::error::security.txt Expires ($expires) is not more than 30 days in the future"
            exit 1
          fi

          echo "all smoke tests passed"
