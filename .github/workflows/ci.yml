name: CI

# PR-only validation (plus a re-check on main). This workflow NEVER deploys —
# deploy.yml is the only thing that ships. A red audit here blocks the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── secret scan (blocking) ──────────────────────────────────────
      # Install the binary directly rather than gitleaks-action, which
      # requires a paid licence key for organisation repos. Pinned version +
      # SHA256-verified before the binary is ever executed (supply chain).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      # ── build + both QA gates (shared with deploy.yml) ──────────────
      - uses: ./.github/actions/build-and-audit
